# ds002158 EEG decoding, confirmatory analysis on the 17 subjects not used to build the
# pipeline. Written 2026-11-19, before any of these subjects was downloaded or decoded.
#
# Changes from the 2-subject exploratory plan (configs/ds002158_eeg_decoding.yaml), all
# motivated by that analysis and fixed here in advance:
#  * score_mode per_group: each held-out run is scored separately and averaged, removing
#    the bias from run-to-run drift of the target;
#  * inference across subjects (one-sided Wilcoxon of per-subject scores vs chance) instead
#    of per-subject permutations;
#  * leave-one-subject-out decoding (train on all other subjects) as the subject-held-out
#    analysis.
# sub-02 and sub-04 are loaded (they add training data for leave-one-subject-out) and
# reported, but excluded from every group test. sub-20 is excluded (label conflict).
epochs_dir: data/derivatives/ldm-eeg   # override with --epochs-dir
subjects: [sub-02, sub-04, sub-07, sub-08, sub-09, sub-10, sub-11, sub-12, sub-13, sub-14,
           sub-15, sub-16, sub-17, sub-18, sub-19, sub-21, sub-22, sub-24, sub-26]
confirmatory_subjects: [sub-07, sub-08, sub-09, sub-10, sub-11, sub-12, sub-13, sub-14,
                        sub-15, sub-16, sub-17, sub-18, sub-19, sub-21, sub-22, sub-24, sub-26]
min_runs: 3       # a subject enters a group test with >= 3 usable runs ...
min_trials: 40    # ... and >= 40 trials for that condition
conditions: [active, observed]
windows: [pre_decision, response_locked, post_decision]
bin_seconds: 0.05
score_mode: per_group
n_perm: 0
n_perm_transfer: 0
loso: true
seed: 0
n_jobs: 8
targets:
  choice_side: {task: classification}          # positive control
  accuracy: {task: classification}             # secondary
  confidence: {task: regression, primary: true}  # PRIMARY: 2 conditions x 3 windows, Holm
  confidence_beyond_behavior:                  # secondary
    task: regression
    target: confidence
    covariates: [accuracy, response_latency_seconds, evidence_dots_difference]

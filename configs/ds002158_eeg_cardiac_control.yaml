# ds002158 EEG: cardiac controls for the post-decision confidence effect (exploratory,
# post hoc; written 2026-11-20 before any per-trial cardiac feature was computed).
#
# Question: the confirmatory post-decision confidence effect transfers across subjects
# after AAS heartbeat cleaning but not after OBS. Does heartbeat timing explain it?
# Run this config on each cleaning method's epochs (aas, obs, ica, aas_ica).
#
#  * rpeak_timing: how well the EEG predicts when the next R peak follows the response.
#    The brain's own heartbeat-evoked response contributes, so this is not zero even with
#    perfect cleaning; differences between cleaning methods index residual BCG artifact.
#  * confidence_cardiac_trials: the primary target restricted to trials with plausible
#    heartbeat intervals (the trials used by the next target).
#  * confidence_beyond_cardiac: confidence residualised (in the training fold) on R-peak
#    timing around the response and the surrounding heart periods. If the effect were
#    carried by heartbeat timing, it would shrink here.
# Inference as in the confirmatory plan (17 subjects, per-run scoring, Wilcoxon, LOSO).
epochs_dir: data/derivatives/ldm-eeg   # override with --epochs-dir
subjects: [sub-02, sub-04, sub-07, sub-08, sub-09, sub-10, sub-11, sub-12, sub-13, sub-14,
           sub-15, sub-16, sub-17, sub-18, sub-19, sub-21, sub-22, sub-24, sub-26]
confirmatory_subjects: [sub-07, sub-08, sub-09, sub-10, sub-11, sub-12, sub-13, sub-14,
                        sub-15, sub-16, sub-17, sub-18, sub-19, sub-21, sub-22, sub-24, sub-26]
min_runs: 3
min_trials: 40
conditions: [active, observed]
windows: [post_decision]
bin_seconds: 0.05
score_mode: per_group
n_perm: 0
n_perm_transfer: 0
loso: true
seed: 0
n_jobs: 8
targets:
  rpeak_timing: {task: regression, column: hb_next_rpeak_s}
  confidence_cardiac_trials:
    task: regression
    target: confidence
    require_columns: [hb_prev_rpeak_s, hb_next_rpeak_s, hb_ibi_resp0_s, hb_ibi_resp1_s]
  confidence_beyond_cardiac:
    task: regression
    target: confidence
    primary: true   # Holm over the 2 conditions
    covariates: [hb_prev_rpeak_s, hb_next_rpeak_s, hb_ibi_resp0_s, hb_ibi_resp1_s]

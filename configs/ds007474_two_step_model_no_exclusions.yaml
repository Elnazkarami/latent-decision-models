# LDM-007 sensitivity analysis: the primary analysis (ds007474_two_step_model.yaml)
# without RT or subject exclusions.
# Input from: ldm ds007474 trials --osf-root data/ds007474_osf --out data/ds007474_trials.csv
input: data/ds007474_trials.csv
output: reports/ds007474_two_step_model_no_exclusions.json
fits_table: reports/ds007474_two_step_model_no_exclusions_fits.csv
data_kind: real_behavioral_openneuro_ds007474_v1.0.5_osf_ctfzd
models: [mf, mb, hybrid, hybrid_contingency]
reference: hybrid
reward: binary              # learn from win / no win (sensitivity: points)
min_rt: null                # sensitivity: score every response
max_missed_fraction: null   # sensitivity: keep every subject
exclude_subjects: []
n_starts: 4
prior_sd: 2.5
n_folds: 5                  # subject-held-out folds (pooled parameters)
n_boot: 2000
n_rep: 20                   # posterior-predictive replays per subject
seed: 0
n_jobs: 8

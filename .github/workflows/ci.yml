name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: ldm simulate --out /tmp/ldm_trials.csv
      - run: ldm validate --input /tmp/ldm_trials.csv
      - run: ldm ds002158 trials --bids-root tests/fixtures/ds002158 --out /tmp/ldm_ds002158_trials.csv
  test-fmri-extra:
    # optional neuroimaging dependencies (nibabel, nilearn): runs the tests that skip without them
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,fmri]'
      - run: pytest -q tests/test_ds002158_fmri.py tests/test_fmri_lss.py
  test-deep-extra:
    # optional PyTorch dependency (CPU): behavior + EEG fusion network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,deep]'
      - run: pytest -q tests/test_fusion.py

  test-eeg-extra:
    # optional EEG dependency (MNE): BrainVision reading with stale header file names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,eeg]'
      - run: pytest -q tests/test_eeg.py
